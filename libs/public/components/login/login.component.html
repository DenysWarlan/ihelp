<ng-container *transloco="let t">
  <div class="login">
    <div class="login__brand">
      <div class="login__brand-content">
        <ui-icon name="HeartHandshake" [size]="64" color="var(--ihelp-text-inverse)" />
        <h1 class="login__brand-title">{{ t('layout.appName') }}</h1>
        <p class="login__brand-subtitle">{{ t('login.brandSubtitle') }}</p>
      </div>
    </div>

    <div class="login__form-side">
      <div class="login__form-container">
        <h2 class="login__title">{{ t('login.title') }}</h2>
        <p class="login__subtitle">{{ t('login.subtitle') }}</p>

        @if (errorMessage()) {
          <div class="login__error" role="alert">
            <ui-icon name="AlertCircle" [size]="18" color="var(--ihelp-error)" />
            <span>{{ t('login.oauthError') }}</span>
            <button type="button" class="login__error-retry" (click)="retry()">
              {{ t('login.retry') }}
            </button>
          </div>
        }

        <div class="login__oauth">
          <button type="button" class="login__oauth-btn login__oauth-btn--google" (click)="loginWith('google')">
            {{ t('login.google') }}
          </button>
          <button type="button" class="login__oauth-btn login__oauth-btn--facebook" (click)="loginWith('facebook')">
            {{ t('login.facebook') }}
          </button>
          <button type="button" class="login__oauth-btn login__oauth-btn--telegram" (click)="loginWith('telegram')">
            {{ t('login.telegram') }}
          </button>
        </div>

        <p class="login__consent">{{ t('login.consent') }}</p>
      </div>
    </div>
  </div>
</ng-container>
