<ng-container *transloco="let t">
  <section class="consultant-dashboard">
    <h1 class="consultant-dashboard__title">{{ t('staff.consultant') }}</h1>

    <div class="consultant-dashboard__cards">
      <a routerLink="../cases" class="consultant-dashboard__link">
        <ui-card padding="md" [hoverable]="true">
          <div class="nav-card">
            <ui-icon name="FolderOpen" [size]="28" color="var(--ihelp-accent)" />
            <div class="nav-card__content">
              <span class="nav-card__label">{{ t('staff.cases') }}</span>
              <span class="nav-card__desc">{{ t('coordinator.consultantCasesDesc') }}</span>
            </div>
          </div>
        </ui-card>
      </a>

      <a routerLink="/person/courses" class="consultant-dashboard__link">
        <ui-card padding="md" [hoverable]="true">
          <div class="nav-card">
            <ui-icon name="BookOpen" [size]="28" color="var(--ihelp-accent)" />
            <div class="nav-card__content">
              <span class="nav-card__label">{{ t('staff.courses') }}</span>
              <span class="nav-card__desc">{{ t('consultant.coursesDesc') }}</span>
            </div>
          </div>
        </ui-card>
      </a>
    </div>
  </section>
</ng-container>
