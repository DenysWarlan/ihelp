<div
  class="progress-bar__track"
  role="progressbar"
  [attr.aria-valuenow]="clampedValue()"
  aria-valuemin="0"
  aria-valuemax="100"
>
  <div
    class="progress-bar__fill"
    [style.width.%]="clampedValue()"
  ></div>
</div>
@if (showLabel()) {
  <span class="progress-bar__label">{{ clampedValue() }}%</span>
}
