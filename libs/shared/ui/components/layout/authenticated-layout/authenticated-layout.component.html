<ng-container *transloco="let t">
  <div class="auth-layout">
    <!-- Overlay for mobile sidebar -->
    @if (sidebarOpen()) {
      <div class="sidebar-overlay" (click)="closeSidebar()"></div>
    }

    <aside
      class="sidebar"
      [class.sidebar--open]="sidebarOpen()"
      role="navigation"
      [attr.aria-label]="t('layout.appName')"
    >
      <div class="sidebar__header">
        <a routerLink="/" class="sidebar__logo" [attr.aria-label]="t('layout.appName')">
          <ui-icon name="HeartHandshake" [size]="28" color="var(--ihelp-accent)" />
          <span class="sidebar__title">{{ t('layout.appName') }}</span>
        </a>
      </div>

      <nav class="sidebar__nav">
        @for (item of navItems(); track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="sidebar__nav-item--active"
            [routerLinkActiveOptions]="{ exact: item.route === '/person' }"
            class="sidebar__nav-item"
            (click)="closeSidebar()"
          >
            <ui-icon [name]="item.icon" [size]="20" />
            <span>{{ t(item.label) }}</span>
          </a>
        }
      </nav>

      <div class="sidebar__footer">
        <button
          class="sidebar__logout"
          type="button"
          [attr.aria-label]="t('common.signOut')"
        >
          <ui-icon name="LogOut" [size]="20" color="var(--ihelp-text-secondary)" />
          <span>{{ t('common.signOut') }}</span>
        </button>
      </div>
    </aside>

    <div class="auth-main">
      <div class="auth-main__topbar">
        <!-- Hamburger (mobile/tablet) -->
        <button
          type="button"
          class="auth-main__hamburger"
          (click)="toggleSidebar()"
          [attr.aria-expanded]="sidebarOpen()"
          [attr.aria-label]="sidebarOpen() ? t('layout.collapseSidebar') : t('layout.expandSidebar')"
        >
          <ui-icon name="Menu" [size]="24" />
        </button>

        <div class="auth-main__avatar" [attr.aria-label]="t('layout.userMenu')">
          <span class="auth-main__avatar-initials">{{ userInitials() }}</span>
        </div>
      </div>

      <main class="auth-content" role="main">
        <router-outlet />
      </main>
    </div>
  </div>
</ng-container>
