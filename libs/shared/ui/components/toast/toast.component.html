<div class="toast-container">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast toast--{{ toast.variant }}" role="alert" (click)="toastService.dismiss(toast.id)" (keydown.enter)="toastService.dismiss(toast.id)" tabindex="0">
      <ui-icon [name]="getIcon(toast.variant)" [size]="18" />
      <div class="toast__body">
        @if (toast.title) {
          <span class="toast__title">{{ toast.title }}</span>
        }
        <span class="toast__message">{{ toast.message }}</span>
      </div>
      <button class="toast__close" type="button">
        <ui-icon name="X" [size]="14" />
      </button>
    </div>
  }
</div>
