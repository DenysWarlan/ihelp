<div class="select-field" [class.select-field--error]="errorMessage()" [class.select-field--disabled]="isDisabled()">
  @if (label()) {
    <label class="select-field__label" [attr.for]="selectId">{{ label() }}</label>
  }
  <div class="select-field__wrapper">
    <select
      [id]="selectId"
      class="select-field__control"
      [value]="value()"
      [disabled]="isDisabled()"
      [attr.aria-label]="label() || placeholder()"
      [attr.aria-invalid]="!!errorMessage()"
      (change)="onSelectionChange($any($event))"
      (blur)="onBlur()"
    >
      @if (placeholder()) {
        <option value="" disabled [selected]="!value()">{{ placeholder() }}</option>
      }
      @for (option of options(); track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
    <ui-icon class="select-field__chevron" name="ChevronDown" [size]="16" color="var(--ihelp-text-secondary)" />
  </div>
  @if (errorMessage()) {
    <span class="select-field__error" role="alert">{{ errorMessage() }}</span>
  }
</div>
